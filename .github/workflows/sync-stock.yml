name: Sync Stock

on:
  schedule:
    # 10:00 UTC = 07:00 Argentina (UTC-3)
    - cron: '0 10 * * *'
    # 22:00 UTC = 19:00 Argentina (UTC-3)
    - cron: '0 22 * * *'
  workflow_dispatch:  # permite ejecución manual desde GitHub Actions

jobs:
  sync:
    name: Actualizar stock.json
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necesario para hacer git commit + push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar sync de stock
        run: node scripts/sync-stock.js

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo/stock.json
          if git diff --cached --quiet; then
            echo "Sin cambios en stock.json — nada que commitear"
          else
            AHORA=$(TZ='America/Argentina/Buenos_Aires' date '+%d/%m/%Y %H:%M')
            git commit -m "chore: sync stock ${AHORA} (Argentina)"
            git push
          fi
